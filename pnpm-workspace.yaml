packages:
  - packages/*
  - features
  - examples/*
  - apps/*

# The Effect packages follow npm's `latest` dist-tag in the dev catalog, never a pin;
# `pnpm-lock.yaml` is what makes an install reproducible. To move it:
#   pnpm update -r --no-save effect @effect/vitest @effect/platform-node @effect/atom-react
# `--no-save` is required: without it pnpm rewrites this catalog, replacing `latest` with the
# resolved `^4.x.y` and deleting every comment in this file (CCR-QD-384). Published @qadi packages do NOT depend on
# `effect` at runtime: they declare it (and `@effect/atom-react` for @qadi/react) under
# `peerDependencies` via the `peer` catalog below, so a consumer has exactly one effect instance in
# their tree. Our public API is made of effect classes (`Context.Service`, `Data.TaggedError`),
# which is why a second copy would be a silent type mismatch rather than a loud failure.
# `pnpm pack` expands `catalog:peer` verbatim into the tarball (AGENTS.md §16, gate 14), so an
# exact pin written in the `peer` catalog would strand every consumer on a different 4.x build —
# ranges only there. See ADR-QD-001's amendment.
catalog:
  '@effect/atom-react': latest
  '@effect/platform-node': latest
  '@effect/vitest': latest
  '@testing-library/react': ^16.3.3
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitest/coverage-v8': 5.1.0
  effect: latest
  fast-check: 4.10.2
  happy-dom: ^21.0.4
  react: 19.3.1
  react-dom: 19.3.1
  typescript: ^7.0.0
  vitest: 5.1.0

# Ranges, peerDependencies only: stable Effect v4 and any later 4.x.
catalogs:
  peer:
    '@effect/atom-react': ^4.0.0
    effect: ^4.0.0

onlyBuiltDependencies:
  # A native build, needed by @prisma/adapter-better-sqlite3 in @qadi/predicate-prisma's
  # real-engine tests (ARCH-03 N5): without this a CI `pnpm install` skips its install script.
  - better-sqlite3
  - esbuild
  - msgpackr-extract
