# The merge gate, run by a machine.
#
# This workflow runs `pnpm check` and nothing else, deliberately. That command is
# the gate `spec/process/definitions-of-done.md` documents, so a CI job running a
# different set of steps would be a second definition of "done" — and two
# definitions of one thing drifting apart is the defect this library was rewritten
# to remove. Adding a gate means editing `check` and the DoD table together; CI
# then follows for free.
#
# Every number in the specification was produced by someone running this by hand
# until now.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run tells you nothing. Cancel it and keep the newest.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Measured at 27m34s-28m52s per leg on the existing Node 26 job (`gh run
    # list`, run ids 33128274504 / 32910760829 / 32898144273) against the prior
    # 30-minute budget — roughly 96% of budget on the faster runtime, with the
    # older, slower floor leg about to join it. 60 leaves real headroom instead
    # of failing the floor leg on the clock rather than on merit.
    timeout-minutes: 60

    # Runs the same job twice, once per Node version below, rather than adding a
    # second job — the matrix is what lets this stay one job definition (see
    # `jobs.check`'s docstring below the strategy block) while genuinely
    # exercising two runtimes. `fail-fast: false` because the default (`true`)
    # would cancel the still-running leg the moment either one fails, hiding
    # whether a failure is version-specific — both legs are independently
    # blocking (below), so both need to report.
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.12.0", "26"]

    steps:
      # Every third-party action below is pinned to a full commit SHA, not a
      # mutable version tag — a tag can be re-pointed, by its owner or by a
      # supply-chain compromise, to different code with no change to this
      # file, which a SHA cannot. The trailing comment names the tag the SHA
      # resolved to, for a human reading this file; it plays no role in what
      # actually runs. Verified live against each action's GitHub repository
      # (`gh api repos/<owner>/<repo>/git/ref/tags/<tag>`) rather than copied
      # from memory.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Takes the version from `packageManager` in package.json, so the lockfile
      # and the installer cannot disagree.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Two legs, for the reason this comment already gave for a single
          # version: a gate whose toolchain changes underneath it reports
          # failures that are not about the change under test. That discipline
          # only fully holds for the first leg — `22.12.0` is an exact pin, the
          # declared floor from `engines` in package.json (where `vitest`'s own
          # `^22.12.0` requirement bites — see ADR-QD-074), and is now actually
          # exercised, not just declared: this leg is what turns `engines` into
          # a verified claim rather than a promise with nothing behind it. The
          # floor moved here from `20.19.0` when the workspace's `effect`/
          # `vitest` bump forced it — see ADR-QD-074.
          #
          # `26` is a bare major, not an exact pin: `actions/setup-node@v4`
          # resolves it to whichever `26.x.y` is newest at job-run time, so
          # this leg's toolchain deliberately floats forward as Node ships new
          # `26.x` patches and minors — it is meant to track "the latest stable
          # major, and the one development actually happens on" (still true),
          # not to be reproducible run to run the way `22.12.0` is. Both are
          # required, blocking legs of this one job — no informational grace
          # period on either — but only one of the two is exempt from toolchain
          # drift as a source of unrelated failure.
          #
          # One step of `pnpm check` is runtime-scoped rather than identical
          # on both legs: the website build (`node scripts/check-website-build.mjs`,
          # step 23 per spec/process/definitions-of-done.md) builds `apps/website`
          # on whichever leg satisfies Astro's own `engines.node` floor and
          # states the skip in one log line on the leg that does not. See
          # ADR-QD-059 — this does not change which steps run, only what one
          # step does on a runtime its own toolchain does not support.
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        # Frozen: CI must fail on a stale lockfile rather than quietly resolving
        # something the author never ran.
        run: pnpm install --frozen-lockfile

      - name: Merge gate
        run: pnpm check

      # The mutation HTML reports are the artefact you want when a score drops,
      # and they are the one thing `pnpm check` produces that a log cannot show.
      # Six suites (`stryker run` plus `stryker.devtools.mjs`, `stryker.predicate-sql.mjs`,
      # `stryker.predicate-prisma.mjs`, `stryker.audit.mjs` and `stryker.http.mjs` —
      # steps 16–21 per spec/process/definitions-of-done.md), six sibling report directories —
      # `upload-artifact`'s `path` does not glob sibling directories from one
      # entry, so each needs naming or one of the six reports is produced in CI
      # and thrown away silently (found in review: only `reports/mutation/`,
      # core's own, was ever uploaded).
      #
      # `name` carries `matrix.node-version`. `upload-artifact@v4` rejects a
      # second upload to a name already used earlier in the same workflow run
      # (no per-matrix-leg suffix, unlike v3) — `fail-fast: false` above keeps
      # both legs of this matrix running to completion, so without the suffix
      # whichever leg's upload lands second collides with the first and errors,
      # silently (`continue-on-error` below), dropping that leg's six reports
      # rather than the one this comment already names. Both legs mutate the
      # same source, but a survivor set can still differ by runtime, so both
      # are worth keeping.
      #
      # `continue-on-error` because this is diagnostics, not a gate: if the gate
      # passed, the build passed, and a transient upload failure should not turn
      # that red. It also means a local `act` run is green — act cannot supply
      # `ACTIONS_RUNTIME_TOKEN`, so this step can never succeed there.
      - name: Upload mutation reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report-node${{ matrix.node-version }}
          path: |
            reports/mutation/
            reports/mutation-devtools/
            reports/mutation-predicate-sql/
            reports/mutation-predicate-prisma/
            reports/mutation-audit/
            reports/mutation-http/
          if-no-files-found: ignore
          retention-days: 14
