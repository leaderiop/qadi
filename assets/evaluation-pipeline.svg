<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d" style="--still:-2.5s">
  <title id="t">How Qadi decides</title>
  <desc id="d">A subject, a policy, an optional resource and the ports the policy needs flow into evaluate, a single Effect. It produces a Decision: an Allow carrying visible fields, obligations and a trace, or a Deny carrying a reason and a trace. Reporting calls (decide, check) return the deny as a value; enforcing calls (assert, enforce, enforceProjected, enforceLoaded, filter) fail with AccessDenied.</desc>
  <style>
    svg{--card:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--text:#1f2328;--muted:#59636e;--acc:#0b7f8c;--accs:#e3f5f7;--ok:#1a7f37;--oks:#e6f6ea;--no:#cf222e;--nos:#fdecec}
    @media (prefers-color-scheme:dark){svg{--card:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#9198a1;--acc:#39c5d1;--accs:#0e2a2e;--ok:#3fb950;--oks:#10261a;--no:#f85149;--nos:#2c1517}}
    text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text)}
    .mono,.mono text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .m,.m text{fill:var(--muted)} .a,.a text{fill:var(--acc)} .g,.g text{fill:var(--ok)} .r,.r text{fill:var(--no)} .b{font-weight:600}
    .card{fill:var(--card);stroke:var(--line)} .box{fill:var(--panel);stroke:var(--line)}
    .flow{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:4 8;animation:flow 1.1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-12}}
    .A{animation:A 10s linear infinite} .B{animation:B 10s linear infinite}
    @keyframes A{0%{opacity:0}3%,46%{opacity:1}50%,100%{opacity:0}}
    @keyframes B{0%,50%{opacity:0}53%,96%{opacity:1}100%{opacity:0}}
    .pulse{fill:none;stroke:var(--acc);stroke-width:2.5;animation:pulse 10s ease-out infinite}
    @keyframes pulse{0%{opacity:.9}10%{opacity:0}50%{opacity:.9}60%,100%{opacity:0}}
    .pk{fill:var(--acc);animation:pk 5s ease-in-out infinite}
    @keyframes pk{0%{opacity:0;transform:translateX(0)}6%{opacity:1}16%{opacity:1;transform:translateX(62px)}20%,100%{opacity:0;transform:translateX(62px)}}
    @media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important;animation-delay:var(--still)!important}}
  </style>

  <rect class="card" x="0.5" y="0.5" width="999" height="469" rx="18"/>

  <!-- inputs -->
  <g font-size="12.5">
    <rect class="box" x="24" y="40" width="236" height="72" rx="10"/>
    <text x="40" y="65" font-size="15" class="b">Subject</text>
    <text x="40" y="85" class="m">id · roles · attributes</text>
    <text x="40" y="102" class="mono a" font-size="11.5">CurrentSubject</text>

    <rect class="box" x="24" y="128" width="236" height="72" rx="10"/>
    <text x="40" y="153" font-size="15" class="b">Policy</text>
    <text x="40" y="173" class="m">a tree of 16 node types, JSON-safe</text>
    <text x="40" y="190" class="mono a" font-size="11.5">allOf · anyOf · hasRole · …</text>

    <rect class="box" x="24" y="216" width="236" height="72" rx="10"/>
    <text x="40" y="241" font-size="15" class="b">Resource</text>
    <text x="40" y="261" class="m">optional — the row being decided on</text>
    <text x="40" y="278" class="mono a" font-size="11.5">{ id, ownerId, tenantId, … }</text>

    <rect class="box" x="24" y="304" width="236" height="72" rx="10"/>
    <text x="40" y="329" font-size="15" class="b">Ports</text>
    <text x="40" y="349" class="m">what the policy needs looked up</text>
    <text x="40" y="366" class="mono a" font-size="11.5">five services, each a Layer</text>
  </g>

  <path class="flow" d="M260 76 C305 76 305 190 350 190"/>
  <path class="flow" d="M260 164 C305 164 305 204 350 204"/>
  <path class="flow" d="M260 252 C305 252 305 220 350 220"/>
  <path class="flow" d="M260 340 C305 340 305 234 350 234"/>

  <!-- evaluate -->
  <rect class="box" x="350" y="168" width="180" height="88" rx="14" stroke-width="1.5"/>
  <rect class="pulse" x="350" y="168" width="180" height="88" rx="14"/>
  <text class="mono b" x="440" y="206" font-size="20" text-anchor="middle">evaluate</text>
  <text x="440" y="227" font-size="12" text-anchor="middle" class="m">one Effect · traced</text>
  <text x="440" y="244" font-size="12" text-anchor="middle" class="m">typed errors, no throws</text>

  <path d="M530 212 H600" stroke="var(--line)" stroke-width="1.5"/>
  <circle class="pk" cx="536" cy="212" r="4"/>

  <!-- decision -->
  <rect class="box" x="600" y="128" width="200" height="168" rx="12"/>
  <rect class="A" x="600" y="128" width="200" height="168" rx="12" fill="none" stroke="var(--ok)" stroke-width="2"/>
  <rect class="B" x="600" y="128" width="200" height="168" rx="12" fill="none" stroke="var(--no)" stroke-width="2"/>
  <text x="616" y="154" font-size="15" class="b">Decision</text>
  <g class="A mono" font-size="12">
    <rect x="616" y="166" width="70" height="24" rx="12" fill="var(--oks)" stroke="var(--ok)"/>
    <text x="651" y="182" text-anchor="middle" class="g">Allow</text>
    <text x="616" y="214">visibleFields</text>
    <text x="616" y="234">obligations</text>
    <text x="616" y="254">trace</text>
    <text x="616" y="274" class="m">evaluationId</text>
  </g>
  <g class="B mono" font-size="12">
    <rect x="616" y="166" width="62" height="24" rx="12" fill="var(--nos)" stroke="var(--no)"/>
    <text x="647" y="182" text-anchor="middle" class="r">Deny</text>
    <text x="616" y="214">reason</text>
    <text x="616" y="234">trace</text>
    <text x="616" y="254" class="m">evaluationId</text>
  </g>

  <path class="flow" d="M800 180 C815 180 815 125 830 125"/>
  <path class="flow" d="M800 244 C815 244 815 314 830 314"/>

  <!-- report lane -->
  <rect class="box" x="830" y="60" width="150" height="130" rx="12"/>
  <text x="846" y="86" font-size="14" class="b">report</text>
  <text x="846" y="104" font-size="11.5" class="m">a deny is a value</text>
  <g class="mono" font-size="12">
    <text x="846" y="138">decide</text><text x="846" y="166">check</text>
    <g class="A"><text x="904" y="138" class="g">→ Allow</text><text x="904" y="166" class="g">→ true</text></g>
    <g class="B"><text x="904" y="138" class="r">→ Deny</text><text x="904" y="166" class="r">→ false</text></g>
  </g>

  <!-- enforce lane -->
  <rect class="box" x="830" y="214" width="150" height="208" rx="12"/>
  <text x="846" y="240" font-size="14" class="b">enforce</text>
  <text x="846" y="258" font-size="11.5" class="m">a deny is a failure</text>
  <g class="mono" font-size="12">
    <text x="846" y="286">assert</text>
    <text x="846" y="306">enforce</text>
    <text x="846" y="326">enforceProjected</text>
    <text x="846" y="346">enforceLoaded</text>
    <text x="846" y="366">filter · …Stream</text>
    <text x="846" y="402" class="A g">→ your value</text>
    <text x="846" y="402" class="B r">→ AccessDenied</text>
  </g>

  <text x="500" y="452" font-size="13.5" text-anchor="middle" class="m">Every entry point runs the same evaluation. Reporting or enforcing is only what happens to a Deny.</text>
</svg>
