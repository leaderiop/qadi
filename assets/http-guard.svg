<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t d" style="--still:-7.6s">
  <title id="t">HTTP: authorization is declared per endpoint, never inferred</title>
  <desc id="d">A request passes through SubjectExtractor and the RequirePermission middleware, which guards the endpoint's policy. Alice's read reaches the handler and gets 200. Bob's delete is denied with 403 AccessDenied, its trace redacted. At layer build, an endpoint with neither RequiredPermission nor PublicEndpoint makes guardApi fail with AccessNotDeclared.</desc>
  <style>
    svg{--card:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--text:#1f2328;--muted:#59636e;--acc:#0b7f8c;--accs:#e3f5f7;--ok:#1a7f37;--oks:#e6f6ea;--no:#cf222e;--nos:#fdecec}
    @media (prefers-color-scheme:dark){svg{--card:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#9198a1;--acc:#39c5d1;--accs:#0e2a2e;--ok:#3fb950;--oks:#10261a;--no:#f85149;--nos:#2c1517}}
    text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text)}
    .mono,.mono text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .m,.m text{fill:var(--muted)} .a,.a text{fill:var(--acc)} .g,.g text{fill:var(--ok)} .r,.r text{fill:var(--no)} .b{font-weight:600}
    .card{fill:var(--card);stroke:var(--line)} .box{fill:var(--panel);stroke:var(--line)}
    .arrow{fill:none;stroke:var(--line);stroke-width:1.5}
    .k{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:linear}
    .tok{fill:var(--acc);animation-name:tok;animation-timing-function:ease-in-out}
    @keyframes tok{0%{opacity:0;transform:translate(0,0)}2%{opacity:1;transform:translate(0,0)}12%{transform:translate(200px,0)}20%{transform:translate(406px,0)}30%{transform:translate(612px,0)}38%{opacity:1;transform:translate(800px,0)}42%,50%{opacity:0;transform:translate(800px,0)}
      51%{opacity:0;transform:translate(0,0)}52%{opacity:1;transform:translate(0,0)}62%{transform:translate(200px,0)}70%{transform:translate(406px,0)}74%{transform:translate(406px,0)}80%{opacity:1;transform:translate(406px,110px)}84%,100%{opacity:0;transform:translate(406px,110px)}}
    .rA{animation-name:rA} .rB{animation-name:rB} .ok200{animation-name:ok200} .no403{animation-name:no403} .guard{animation-name:guard}
    @keyframes rA{0%{opacity:0}2%,46%{opacity:1}50%,100%{opacity:0}}
    @keyframes rB{0%,50%{opacity:0}52%,96%{opacity:1}99%,100%{opacity:0}}
    @keyframes ok200{0%,36%{opacity:0}38%,48%{opacity:1}50%,100%{opacity:0}}
    @keyframes no403{0%,78%{opacity:0}80%,96%{opacity:1}99%,100%{opacity:0}}
    @keyframes guard{0%,18%{opacity:0}20%,24%{opacity:1}26%,68%{opacity:0}70%,76%{opacity:1}78%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important;animation-delay:var(--still)!important}}
  </style>

  <rect class="card" x="0.5" y="0.5" width="999" height="419" rx="18"/>
  <text x="24" y="38" font-size="15" class="b">Authorization is declared per endpoint, never inferred</text>
  <text x="24" y="60" font-size="12.5" class="m">guardApi(Api) guards an HttpApi, addGuardedRoute a bare route; both list what they enforce at /__permissions.</text>

  <g font-size="12.5">
    <rect class="box" x="24" y="100" width="150" height="60" rx="10"/>
    <text x="40" y="124" class="m" font-size="11.5">request</text>
    <text class="mono k rA" x="40" y="146" font-size="11.5">alice GET /docs/42</text>
    <text class="mono k rB" x="40" y="146" font-size="11.5">bob DELETE /docs/42</text>
    <path class="arrow" d="M174 130 H210"/>

    <rect class="box" x="210" y="100" width="170" height="60" rx="10"/>
    <text class="mono b" x="295" y="126" text-anchor="middle" font-size="12">SubjectExtractor</text>
    <text x="295" y="146" text-anchor="middle" class="m" font-size="11.5">who is asking</text>
    <path class="arrow" d="M380 130 H416"/>

    <rect class="box" x="416" y="100" width="180" height="60" rx="10"/>
    <rect class="k guard" x="416" y="100" width="180" height="60" rx="10" fill="var(--accs)" stroke="var(--acc)" stroke-width="2"/>
    <text class="mono b" x="506" y="126" text-anchor="middle" font-size="12">RequirePermission</text>
    <text class="mono a" x="506" y="146" text-anchor="middle" font-size="11.5">guard(policy)</text>
    <path class="arrow" d="M596 130 H632"/>

    <rect class="box" x="632" y="100" width="150" height="60" rx="10"/>
    <text x="707" y="126" text-anchor="middle" class="b">handler</text>
    <text x="707" y="146" text-anchor="middle" class="m" font-size="11.5">your code</text>
    <path class="arrow" d="M782 130 H818"/>

    <rect class="box" x="818" y="100" width="158" height="60" rx="10"/>
    <rect class="k ok200" x="818" y="100" width="158" height="60" rx="10" fill="var(--oks)" stroke="var(--ok)" stroke-width="2"/>
    <text class="mono g" x="897" y="136" text-anchor="middle" font-size="15">200 OK</text>

    <path class="arrow" d="M506 160 V210"/>
    <rect class="box" x="416" y="210" width="180" height="60" rx="10"/>
    <rect class="k no403" x="416" y="210" width="180" height="60" rx="10" fill="var(--nos)" stroke="var(--no)" stroke-width="2"/>
    <text class="mono r" x="506" y="236" text-anchor="middle" font-size="13">403 AccessDenied</text>
    <text x="506" y="256" text-anchor="middle" class="m" font-size="11.5">trace redacted on the wire</text>
  </g>
  <circle class="k tok" cx="100" cy="130" r="6"/>

  <g font-size="12" class="m">
    <text x="640" y="232">denied → 403</text>
    <text x="640" y="250">resolver outage → 502</text>
    <text x="640" y="268">wiring mistake → 500</text>
  </g>

  <rect x="24" y="306" width="952" height="70" rx="12" fill="var(--nos)" stroke="var(--no)" stroke-opacity=".5"/>
  <text x="44" y="334" font-size="13" class="b">At layer build, not at request time</text>
  <text x="44" y="358" font-size="12.5">An endpoint with neither <tspan class="mono">RequiredPermission</tspan> nor <tspan class="mono">PublicEndpoint</tspan> makes <tspan class="mono">guardApi</tspan> fail: <tspan class="mono r">AccessNotDeclared</tspan>.</text>
  <text x="500" y="404" font-size="12.5" text-anchor="middle" class="m">Forgetting an annotation is a startup failure, never an unguarded endpoint.</text>
</svg>
