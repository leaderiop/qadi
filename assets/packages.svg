<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d" style="--still:-1s">
  <title id="t">Qadi's packages</title>
  <desc id="d">@qadi/core is the hub. Eight packages consume it directly and never each other: react, http, promise, testing, audit, devtools, predicate-sql and predicate-prisma.</desc>
  <style>
    svg{--card:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--text:#1f2328;--muted:#59636e;--acc:#0b7f8c;--accs:#e3f5f7}
    @media (prefers-color-scheme:dark){svg{--card:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#9198a1;--acc:#39c5d1;--accs:#0e2a2e}}
    text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text)}
    .mono,.mono text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .m,.m text{fill:var(--muted)} .a,.a text{fill:var(--acc)} .b{font-weight:600}
    .card{fill:var(--card);stroke:var(--line)} .box{fill:var(--panel);stroke:var(--line)}
    .flow{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:4 8;animation:flow 1.2s linear infinite;opacity:.8}
    @keyframes flow{to{stroke-dashoffset:-12}}
    .ring{fill:none;stroke:var(--acc);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 3s ease-out infinite}
    @keyframes ring{0%{opacity:.7;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.45)}}
    @media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important;animation-delay:var(--still)!important}}
  </style>

  <rect class="card" x="0.5" y="0.5" width="999" height="469" rx="18"/>

  <!-- spokes: from the hub outward -->
  <path class="flow" d="M570 230 H785"/>
  <path class="flow" d="M549 180 L674 136"/>
  <path class="flow" d="M500 160 V86"/>
  <path class="flow" d="M451 180 L326 136"/>
  <path class="flow" d="M430 230 H215"/>
  <path class="flow" d="M451 280 L326 324"/>
  <path class="flow" d="M500 300 V374"/>
  <path class="flow" d="M549 280 L674 324"/>

  <circle class="ring" cx="500" cy="230" r="70"/>
  <circle cx="500" cy="230" r="70" fill="var(--accs)" stroke="var(--acc)" stroke-width="2"/>
  <text class="mono b" x="500" y="226" font-size="15" text-anchor="middle">@qadi/core</text>
  <text x="500" y="246" font-size="11.5" text-anchor="middle" class="m">policy · evaluate · ports</text>

  <g class="mono">
    <rect class="box" x="405" y="34" width="190" height="52" rx="10"/>
    <text x="500" y="56" font-size="13" text-anchor="middle" class="b">@qadi/react</text>
    <text x="500" y="74" font-size="11" text-anchor="middle" class="m">atoms over evaluate</text>

    <rect class="box" x="674" y="84" width="190" height="52" rx="10"/>
    <text x="769" y="106" font-size="13" text-anchor="middle" class="b">@qadi/http</text>
    <text x="769" y="124" font-size="11" text-anchor="middle" class="m">guard + CurrentSubject</text>

    <rect class="box" x="785" y="204" width="190" height="52" rx="10"/>
    <text x="880" y="226" font-size="13" text-anchor="middle" class="b">@qadi/predicate-sql</text>
    <text x="880" y="244" font-size="11" text-anchor="middle" class="m">Predicate → SQL</text>

    <rect class="box" x="674" y="324" width="190" height="52" rx="10"/>
    <text x="769" y="346" font-size="12" text-anchor="middle" class="b">@qadi/predicate-prisma</text>
    <text x="769" y="364" font-size="11" text-anchor="middle" class="m">Predicate → WhereInput</text>

    <rect class="box" x="405" y="374" width="190" height="52" rx="10"/>
    <text x="500" y="396" font-size="13" text-anchor="middle" class="b">@qadi/devtools</text>
    <text x="500" y="414" font-size="11" text-anchor="middle" class="m">reads sink records</text>

    <rect class="box" x="136" y="324" width="190" height="52" rx="10"/>
    <text x="231" y="346" font-size="13" text-anchor="middle" class="b">@qadi/audit</text>
    <text x="231" y="364" font-size="11" text-anchor="middle" class="m">a DecisionSink</text>

    <rect class="box" x="25" y="204" width="190" height="52" rx="10"/>
    <text x="120" y="226" font-size="13" text-anchor="middle" class="b">@qadi/testing</text>
    <text x="120" y="244" font-size="11" text-anchor="middle" class="m">doubles · fixtures</text>

    <rect class="box" x="136" y="84" width="190" height="52" rx="10"/>
    <text x="231" y="106" font-size="13" text-anchor="middle" class="b">@qadi/promise</text>
    <text x="231" y="124" font-size="11" text-anchor="middle" class="m">runPromise, nothing else</text>
  </g>

  <text x="500" y="456" font-size="12.5" text-anchor="middle" class="m">Each package consumes @qadi/core and none consumes another. Effect is a peer dependency, so your app holds exactly one copy.</text>
</svg>
